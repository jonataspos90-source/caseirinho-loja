name: Test Caseirinho Loja

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check app.js
          node --check caseirinho-coupon-assistant-v9-5-8.js
          node --check caseirinho-cashback-v9-6-0.js
          node --check customer-cashback-wallet-v9-6-3.js
          node --check commerce-engagement-v9-6-1.js
          node --check commerce-engine-v9-3-0.js
          node --check store-hotfix-v9-3-1.js
          node --check store-hotfix-v9-3-2.js
          node --check store-hotfix-v9-3-3.js
          node --check store-hotfix-v9-3-4.js
          node --check store-hotfix-v9-3-5.js
          node --check checkout-parmesao-v9-3-6.js
          node --check pix-payment-v9-3-7.js
          node --check pix-payment-ensure-v9-3-9.js
          node --check order-receipt-pdf-v9-4-1.js
          node --check order-actions-dedupe-v9-4-2.js
          node --check service-worker.js
      - name: Regression tests
        run: node --test *.test.js
