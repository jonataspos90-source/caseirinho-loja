name: Test Caseirinho Loja

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check app.js
          node --check commerce-engine-v9-3-0.js
          node --check store-hotfix-v9-3-1.js
          node --check store-hotfix-v9-3-2.js
          node --check store-hotfix-v9-3-3.js
          node --check store-hotfix-v9-3-4.js
          node --check service-worker.js
      - name: Regression tests
        run: node --test *.test.js
