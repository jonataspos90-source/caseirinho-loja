name: Exportar fotos de tortas em PNG
on:
  push:
    branches: [exportar-tortas-png-20261103]
    paths: ['.github/workflows/exportar-tortas-png.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Converter fotos oficiais para PNG
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          import io, urllib.request, pathlib
          from PIL import Image
          images = {
            'Torta_Massa_Leve_Frango_Caseirinho.png': 'a63a3113-26b2-4af5-afc2-33d05c14c8c6',
            'Torta_Massa_Leve_Sardinha_Caseirinho.png': 'e1461d19-d9d6-45ea-a001-d4b0fde22079',
          }
          root = pathlib.Path('fotos-tortas-png')
          root.mkdir(parents=True, exist_ok=True)
          for name, mediaid in images.items():
            url = 'https://john-cloud-api-production.up.railway.app/api/v1/public/store/caseirinho/media/' + mediaid
            request = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(request, timeout=45) as response:
              data = response.read()
            im = Image.open(io.BytesIO(data))
            im.save(root / name, format='PNG')
            print(name, len(data), im.size)
          PY
      - name: Publicar PNGs somente nesta branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos-tortas-png/
          git diff --cached --quiet || (git commit -m "Disponibiliza fotos originais de tortas em PNG" && git push)
